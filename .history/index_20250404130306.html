<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="dist/output.css" rel="stylesheet">
    <title>Portofolio Tailwind CSS</title>
</head>
<body class="overflow-x-hidden">
    <!-- Header Start -->
    <header class="bg-transparent absolute top-0 left-0 w-full flex items-center z-10">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between relative">
                <div class="px-4">
                    <a href="#home" class="font-bold text-lg text-primary block py-6">Fedrico Simatupang</a>
                </div>
                <div class="flex items-center px-4">
                    <button id="hamburger" name="hamburger" type="button" class="block absolute right-4 lg:hidden">
                        <span class="hamburger-line transition duration-300 ease-in-out origin-top-left"></span>
                        <span class="hamburger-line transition duration-300 ease-in-out"></span>
                        <span class="hamburger-line transition duration-300 ease-in-out origin-bottom-left"></span>
                    </button>
                    <nav id="nav-menu" class="hidden absolute py-5 bg-white shadow-lg rounded-lg max-w-[200px] w-full right-4 top-full lg:block lg:static lg:bg-transparent lg:max-h-full lg:shadow-none lg:rounded-none">
                        <ul class="block lg:flex">
                            <li class="group"><a href="#home" class="text-base text-dark py-2 mx-8 flex group-hover:text-primary">Beranda</a></li>
                            <li class="group"><a href="#about" class="text-base text-dark py-2 mx-8 flex group-hover:text-primary">Tentang Saya</a></li>
                            <li class="group"><a href="#portfolio" class="text-base text-dark py-2 mx-8 flex group-hover:text-primary">Portofolio</a></li>
                            <li class="group"><a href="#contact" class="text-base text-dark py-2 mx-8 flex group-hover:text-primary">Kontak</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <!-- Header End -->

    <!-- Hero Section Start -->
    <section id="home" class="pt-36">
        <div class="container mx-auto px-4">
            <div class="flex flex-wrap items-center">
                <div class="w-full px-4 lg:w-1/2">
                    <h1 class="text-base font-semibold text-primary md:text-xl">
                        Hallo Semua🙌, Saya
                        <span class="block font-bold text-dark text-4xl mt-1 lg:text-5xl">
                            Fedrico Simatupang
                        </span>
                    </h1>
                    <h2 class="font-medium text-slate-500 text-lg mb-5">
                        Informatics Engineering Graduate
                    </h2>
                    <p class="font-medium text-secondary mb-10 leading-relaxed">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    </p>
                    <a href="#" class="text-base font-semibold text-white bg-primary py-3 px-8 rounded-full hover:shadow-lg hover:opacity-80 transition duration-300 ease-in-out">
                        Contact Me
                    </a>
                </div>
                <div class="w-full px-4 lg:w-1/2 flex justify-center lg:justify-end">
                    <div class="relative w-[60%] lg:w-[50%]">
                        <img src="dist/rico2-1.png" alt="fedrico" class="w-full h-auto mx-auto" />
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Hero Section End -->

    <!-- About Section Start -->
    <section id="about" class="pt-36 pb-32">
        <div class="container mx-auto px-4">
            <h4 class="font-bold uppercase text-primary text-lg mb-3">About Me</h4>
            <p class="font-medium text-base text-secondary max-w-xl lg:text-lg">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
        </div>
    </section>
    <!-- About Section End -->

    <script src="dist/js/script.js"></script>
</body>
</html>
